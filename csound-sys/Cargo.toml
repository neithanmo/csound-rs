[package]
name = "csound-sys"
version = "0.1.4-alpha.0"
license = "MIT/Apache-2.0"
readme = "README.md"
authors = ["Natanael Mojica <neithanmo@gmail.com>"]
links = "csound64"
build= "build.rs"
edition = "2024"
description = "Native bindings to the libcsound64 library"
categories = ["multimedia::audio", "external-ffi-bindings", "no-std"]
repository = "https://github.com/neithanmo/csound-rs"
exclude = ["csound/_codeql_detected_source_root"]

[dependencies]
libc = "1.0.0-alpha.1"

[build-dependencies]
bindgen = "0.72.1"
cc = "1.2"

[target.'cfg(target_os = "linux")'.build-dependencies]
pkg-config = "0.3"
