name: 'Setup Csound'
description: 'Install Csound build dependencies and build Csound from source'

runs:
  using: 'composite'
  steps:
    - name: Install Csound build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libsndfile1-dev \
          libasound2-dev \
          libportaudio2 \
          libportmidi-dev \
          flex \
          bison

    - name: Cache Csound install
      id: cache-csound
      uses: actions/cache@v4
      with:
        path: ~/csound-install
        key: csound-${{ runner.os }}-v5

    - name: Build Csound
      if: steps.cache-csound.outputs.cache-hit != 'true'
      shell: bash
      run: |
        git clone --depth 1 https://github.com/csound/csound.git ~/csound-src
        cd ~/csound-src
        mkdir -p build && cd build
        cmake .. -DCMAKE_INSTALL_PREFIX=$HOME/csound-install
        make -j$(nproc)
        sudo make install

    - name: Install Csound to system
      shell: bash
      run: |
        sudo cp -a ~/csound-install/lib/* /usr/local/lib/
        sudo cp -a ~/csound-install/include/* /usr/local/include/
        sudo cp -a ~/csound-install/bin/* /usr/local/bin/ 2>/dev/null || true
        sudo ldconfig

    - name: Setup Csound include path for bindgen
      shell: bash
      run: |
        echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/local/include/csound" >> $GITHUB_ENV
