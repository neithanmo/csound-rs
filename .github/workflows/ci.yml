name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  # Format check - no Csound needed
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # Clippy linting
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-csound

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # csound-sys is not a workspace member, so --workspace skips it.
      - name: Clippy (csound-sys)
        run: cargo clippy --locked --manifest-path csound-sys/Cargo.toml --all-targets -- -D warnings

  # Tests
  test:
    name: Tests
    needs: [clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-csound

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked --workspace

      # csound-sys is not a workspace member, so --workspace skips it.
      - name: Run csound-sys tests
        run: cargo test --locked --manifest-path csound-sys/Cargo.toml

      - name: Run ignored tests
        run: cargo test --locked --workspace -- --ignored
        continue-on-error: true

      # The steps above find the copy of Csound in /usr/local. Select the
      # install prefix explicitly instead: the binary must load libcsound64
      # from there through the rpath csound-sys records, not from /usr/local
      # through the loader cache.
      - name: Load Csound from explicit CSOUND_* dirs
        run: |
          export CSOUND_INCLUDE_DIR="$HOME/csound-install/include/csound"
          export CSOUND_LIB_DIR="$HOME/csound-install/lib"
          cargo build --locked --example example1
          readelf -d target/debug/examples/example1 | grep -E 'R(UN)?PATH'
          ldd target/debug/examples/example1 | grep -F "$CSOUND_LIB_DIR/libcsound64.so"

  # Build examples
  examples:
    name: Build Examples
    needs: [clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ./.github/actions/setup-csound

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build all examples
        run: cargo build --locked --examples --release
