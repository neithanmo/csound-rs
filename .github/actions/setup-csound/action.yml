name: 'Setup Csound'
description: 'Install Csound build dependencies and build Csound from source'

runs:
  using: 'composite'
  steps:
    - name: Install Csound build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          libsndfile1-dev \
          libasound2-dev \
          libportaudio2 \
          libportmidi-dev \
          flex \
          bison

    - name: Cache Csound build
      id: cache-csound
      uses: actions/cache@v4
      with:
        path: ~/csound-src/build
        key: csound-${{ runner.os }}-v3

    - name: Clone Csound
      if: steps.cache-csound.outputs.cache-hit != 'true'
      shell: bash
      run: git clone --depth 1 https://github.com/csound/csound.git ~/csound-src

    - name: Build Csound
      if: steps.cache-csound.outputs.cache-hit != 'true'
      shell: bash
      run: |
        cd ~/csound-src
        mkdir -p build && cd build
        cmake ..
        make -j$(nproc)

    - name: Install Csound
      shell: bash
      run: |
        cd ~/csound-src/build
        sudo make install
        sudo ldconfig

    - name: Setup Csound include path for bindgen
      shell: bash
      run: |
        echo "BINDGEN_EXTRA_CLANG_ARGS=-I/usr/local/include/csound" >> $GITHUB_ENV
